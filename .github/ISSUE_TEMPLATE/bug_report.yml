name: Bug report
description: Report something that doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug, including what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Launch WatchYourClaude.app
        2. ...
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 14.5 (Apple Silicon)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / console output
      description: |
        Run `log stream --predicate 'processImagePath CONTAINS "WatchYourClaude"'` while reproducing.
        Do NOT paste full session JSONL files — they may contain private data.
    validations:
      required: false
