name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package app bundle
        run: bash package_app.sh --release

      - name: Zip app bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent WatchYourClaude.app "WatchYourClaude-${VERSION}.zip"
          ls -lh "WatchYourClaude-${VERSION}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: WatchYourClaude-*.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
